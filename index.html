<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#128c7e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>Matadaana Mitra - Election Awareness Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans Devanagari', 'Noto Sans Kannada', 'Noto Sans Tamil', 'Noto Sans Telugu', 'Noto Sans Bengali', 'Noto Sans Gujarati', 'Noto Sans Malayalam', 'Noto Sans Gurmukhi', sans-serif;
    }
    .chat-bg {
      background-color: #efeae2;
      background-image: radial-gradient(#d1d7db 1.2px, transparent 1.2px);
      background-size: 18px 18px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-0 sm:p-4 font-sans">

  <!-- Main Chat Container -->
  <div class="w-full max-w-lg h-screen sm:h-[94vh] bg-white rounded-none sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-gray-200 relative">
    
    <!-- WhatsApp-Style Header -->
    <div class="bg-[#075e54] text-white p-3 flex items-center justify-between shadow-md z-10">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-xl shadow flex-shrink-0">
          🇮🇳
        </div>
        <div class="overflow-hidden">
          <h1 class="font-semibold text-sm sm:text-base leading-tight flex items-center gap-1.5 truncate">
            Matadaana Mitra <i class="fas fa-check-circle text-blue-300 text-xs"></i>
          </h1>
          <p class="text-[11px] text-emerald-200 truncate" id="statusHeader">Official Election AI Assistant • Online</p>
        </div>
      </div>

      <!-- Multi-Language Dropdown -->
      <div class="flex items-center space-x-2">
        <select id="langSelect" onchange="handleLanguageSelect()" class="bg-[#128c7e] hover:bg-emerald-600 text-white px-2 py-1 rounded text-xs font-medium focus:outline-none cursor-pointer border-none shadow-sm">
          <option value="English" selected>English</option>
          <option value="Hindi">हिंदी (Hindi)</option>
          <option value="Kannada">ಕನ್ನಡ (Kannada)</option>
          <option value="Telugu">తెలుగు (Telugu)</option>
          <option value="Tamil">தமிழ் (Tamil)</option>
          <option value="Marathi">मराठी (Marathi)</option>
          <option value="Bengali">বাংলা (Bengali)</option>
          <option value="Gujarati">ગુજરાતી (Gujarati)</option>
          <option value="Malayalam">മലയാളം (Malayalam)</option>
          <option value="Punjabi">ਪੰਜਾਬੀ (Punjabi)</option>
        </select>
      </div>
    </div>

    <!-- Quick Action Chips + Cast Vote Button + Parties + Polling Station + Fact Check + Quiz + Analytics -->
    <div class="bg-[#f0f2f5] p-2 flex items-center gap-2 overflow-x-auto text-xs border-b border-gray-200 no-scrollbar">
      <!-- Vote Button -->
      <button onclick="castVote()" class="whitespace-nowrap bg-red-600 hover:bg-red-700 text-white px-3.5 py-1.5 rounded-full font-bold text-xs shadow-md transition flex items-center gap-1 active:scale-95 flex-shrink-0">
        🗳️ Cast Vote / ಮತ ಚಲಾಯಿಸಿ
      </button>

      <!-- District Analytics Button -->
      <button onclick="fetchDistrictStats('Bengaluru Urban')" class="whitespace-nowrap bg-white border border-emerald-600 text-emerald-800 px-3 py-1 rounded-full shadow-sm hover:bg-emerald-50 active:scale-95 transition font-medium flex-shrink-0">
        📊 District Analytics
      </button>

      <!-- Quiz Button -->
      <button onclick="startCivicQuiz()" class="whitespace-nowrap bg-white border border-emerald-600 text-emerald-800 px-3 py-1 rounded-full shadow-sm hover:bg-emerald-50 active:scale-95 transition font-medium flex-shrink-0">
        🎯 Election Quiz
      </button>

      <!-- Fact Check Button -->
      <button onclick="promptRumorCheck()" class="whitespace-nowrap bg-white border border-emerald-600 text-emerald-800 px-3 py-1 rounded-full shadow-sm hover:bg-emerald-50 active:scale-95 transition flex-shrink-0">
        🛡️ Fact Check / Rumor Buster
      </button>

      <!-- Polling Stations & Queue Button -->
      <button onclick="checkPollingStation()" class="whitespace-nowrap bg-white border border-emerald-600 text-emerald-800 px-3 py-1 rounded-full shadow-sm hover:bg-emerald-50 active:scale-95 transition flex-shrink-0">
        📍 Polling Stations & Queue
      </button>

      <!-- All States & Parties Button -->
      <button onclick="showAllParties()" class="whitespace-nowrap bg-white border border-emerald-600 text-emerald-800 px-3 py-1 rounded-full shadow-sm hover:bg-emerald-50 active:scale-95 transition flex-shrink-0">
        🗺️ All States & Parties
      </button>

      <button onclick="sendQuickPrompt('first_time')" class="whitespace-nowrap bg-white border border-emerald-600 text-emerald-800 px-3 py-1 rounded-full shadow-sm hover:bg-emerald-50 active:scale-95 transition font-medium">
        🗳️ First-Time Voter
      </button>
      <button onclick="sendQuickPrompt('documents')" class="whitespace-nowrap bg-white border border-emerald-600 text-emerald-800 px-3 py-1 rounded-full shadow-sm hover:bg-emerald-50 active:scale-95 transition font-medium">
        🆔 12 Valid IDs
      </button>
      <button onclick="sendQuickPrompt('booth_steps')" class="whitespace-nowrap bg-white border border-emerald-600 text-emerald-800 px-3 py-1 rounded-full shadow-sm hover:bg-emerald-50 active:scale-95 transition font-medium">
        🔘 Inside Polling Booth
      </button>
      <button onclick="sendQuickPrompt('evm_vvpat')" class="whitespace-nowrap bg-white border border-emerald-600 text-emerald-800 px-3 py-1 rounded-full shadow-sm hover:bg-emerald-50 active:scale-95 transition font-medium">
        📟 EVM & VVPAT
      </button>
    </div>

    <!-- Chat Messages Area -->
    <div id="chatBox" class="flex-1 chat-bg p-3 sm:p-4 overflow-y-auto space-y-3 flex flex-col">
      <!-- Welcome Message -->
      <div class="flex items-start">
        <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm max-w-[88%] text-xs sm:text-sm text-gray-800 border border-gray-100">
          <p class="font-bold text-emerald-800 mb-1 flex items-center gap-1.5">
            <span>Namaskara! Welcome to Matadaana Mitra</span> 🙏
          </p>
          <p class="leading-relaxed">
            I am your instant multilingual civic election assistant. Tap <strong>🗳️ Cast Vote</strong>, <strong>📊 District Analytics</strong>, <strong>🎯 Election Quiz</strong>, <strong>🛡️ Fact Check</strong>, or ask any question!
          </p>
          <div class="mt-2 pt-2 border-t border-gray-100 flex items-center justify-between text-[10px] text-gray-400">
            <span>Official Election Awareness AI</span>
            <span>Online ✓✓</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Footer -->
    <div class="bg-[#f0f2f5] p-2.5 sm:p-3 flex items-center space-x-2 border-t border-gray-200">
      <input
        type="text"
        id="userInput"
        placeholder="Ask anything or request district turnout stats..."
        class="flex-1 bg-white border border-gray-300 rounded-full px-4 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-[#075e54] text-gray-800"
        onkeydown="if(event.key === 'Enter') handleSend()"
        autocomplete="off"
      />
      <button
        onclick="handleSend()"
        class="w-9 h-9 sm:w-10 sm:h-10 bg-[#075e54] hover:bg-[#128c7e] text-white rounded-full flex items-center justify-center transition active:scale-95 shadow flex-shrink-0"
        aria-label="Send message"
      >
        <i class="fas fa-paper-plane text-xs sm:text-sm"></i>
      </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
